  <rect x="18" y="35" width="6" height="12" rx="1.4" fill="url(#fi-gold)"/>
  <rect x="29" y="29" width="6" height="18" rx="1.4" fill="url(#fi-gold)"/>
  <rect x="40" y="22" width="6" height="25" rx="1.4" fill="url(#fi-gold)"/>
  <!-- growth arrow -->
  <path d="M16 31.5 27.5 21l6 5L46 14.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M39.5 14h7v7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
