<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Future Investment logo">
  <defs>
    <linearGradient id="fi-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A4FA0"/>
      <stop offset="1" stop-color="#071A3A"/>
    </linearGradient>
    <linearGradient id="fi-gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B8892A"/>
      <stop offset=".55" stop-color="#E9CB74"/>
      <stop offset="1" stop-color="#C9A13B"/>
    </linearGradient>
  </defs>
  <!-- shield -->
  <path d="M32 3 7 11.5v17.8C7 45 18 56.3 32 61c14-4.7 25-16 25-31.7V11.5L32 3Z" fill="url(#fi-navy)" stroke="url(#fi-gold)" stroke-width="2.6" stroke-linejoin="round"/>
